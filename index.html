<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAEP Saúde</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pagina">

        <!-- COLUNA PERFIL -->
        <aside class="perfil">

            <div class="perfil-conteudo">

                <div class="empresa">

                    <img
                        src="iconeSENAI_NOVA.png"
                        alt="Logo SAEP Saúde"
                        class="logo"
                    >

                    <h1>SAEP Saúde</h1>

                </div>

                <div class="totais">

                    <div class="total">
                        <span class="numero">20</span>
                        <span class="descricao">Atividades</span>
                    </div>

                    <div class="total">
                        <span class="numero">5.420</span>
                        <span class="descricao">Calorias</span>
                    </div>

                </div>

                <button class="btn-atividades" disabled>
                    Atividades
                </button>

            </div>

            <footer class="rodape">

                <strong>SAEP Saúde</strong>

                <div class="redes-sociais">

                    <a href="#">
                        <img src="x.png" alt="Twitter">
                    </a>

                    <a href="#">
                        <img src="instagram.png" alt="Instagram">
                    </a>

                    <a href="#">
                        <img src="tiktok.png" alt="TikTok">
                    </a>

                </div>

                <span>© Copyright-2024</span>

            </footer>

        </aside>


        <!-- COLUNA MAIN -->
        <main class="main">

            <!-- CABEÇALHO -->
            <header class="cabecalho">

                <button
                    class="btn-login"
                    id="btn-login"
                    type="button"
                >
                    Login
                </button>

            </header>


            <!-- FILTROS -->
            <section class="filtros">

                <button
                    class="filtro ativo"
                    data-tipo="corrida"
                    type="button"
                >
                    Corrida
                </button>

                <button
                    class="filtro"
                    data-tipo="caminhada"
                    type="button"
                >
                    Caminhada
                </button>

                <button
                    class="filtro"
                    data-tipo="trilha"
                    type="button"
                >
                    Trilha
                </button>

            </section>


            <!-- =====================================================
                 FORMULÁRIO DE CADASTRO DE ATIVIDADE
            ====================================================== -->

            <section class="cadastro-atividade">

                <h2>Crie sua atividade</h2>

                <form id="form-atividade">

                    <!-- TIPO -->
                    <div class="campo-atividade">

                        <label for="tipo-atividade">
                            Tipo de atividade
                        </label>

                        <select
                            id="tipo-atividade"
                            name="tipo_atividade"
                            required
                        >

                            <option value="">
                                Selecione uma atividade
                            </option>

                            <option value="corrida">
                                Corrida
                            </option>

                            <option value="caminhada">
                                Caminhada
                            </option>

                            <option value="trilha">
                                Trilha
                            </option>

                        </select>

                    </div>


                    <!-- DISTÂNCIA -->
                    <div class="campo-atividade">

                        <label for="distancia-atividade">
                            Distância (km)
                        </label>

                        <input
                            type="number"
                            id="distancia-atividade"
                            name="distancia_km"
                            placeholder="Ex.: 5"
                            min="0.1"
                            step="0.1"
                            required
                        >

                    </div>


                    <!-- DURAÇÃO -->
                    <div class="campo-atividade">

                        <label for="duracao-atividade">
                            Duração (minutos)
                        </label>

                        <input
                            type="number"
                            id="duracao-atividade"
                            name="duracao_min"
                            placeholder="Ex.: 30"
                            min="1"
                            required
                        >

                    </div>


                    <!-- DESCRIÇÃO -->
                    <div class="campo-atividade">

                        <label for="descricao-atividade">
                            Descrição
                        </label>

                        <textarea
                            id="descricao-atividade"
                            name="descricao"
                            placeholder="Conte um pouco sobre sua atividade"
                            maxlength="255"
                        ></textarea>

                    </div>


                    <!-- MENSAGEM -->
                    <div
                        class="mensagem-atividade"
                        id="mensagem-atividade"
                    >
                    </div>


                    <!-- BOTÃO -->
                    <button
                        type="submit"
                        class="btn-cadastrar-atividade"
                    >
                        Cadastrar atividade
                    </button>

                </form>

            </section>


            <!-- =====================================================
                 LISTAGEM DE ATIVIDADES
            ====================================================== -->

            <section
                class="atividades"
                id="lista-atividades"
            >
                <!-- Cards criados pelo script.js -->
            </section>


            <!-- =====================================================
                 PAGINAÇÃO
            ====================================================== -->

            <nav
                class="paginacao"
                id="paginacao"
            >
            </nav>

        </main>

    </div>


    <!-- =====================================================
         MODAL DE LOGIN
    ====================================================== -->

    <div
        class="modal-login"
        id="modal-login"
        aria-hidden="true"
    >

        <div class="modal-conteudo">

            <h2>Login</h2>

            <form id="form-login">

                <!-- E-MAIL -->
                <div class="campo-login">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                    >

                </div>


                <!-- SENHA -->
                <div class="campo-login">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                    >

                </div>


                <!-- MENSAGEM DO LOGIN -->
                <div
                    class="mensagem-login"
                    id="mensagem-login"
                >
                </div>


                <!-- AÇÕES -->
                <div class="modal-acoes">

                    <button
                        type="button"
                        class="btn-cancelar"
                        id="btn-cancelar-login"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn-confirmar"
                    >
                        Login
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
