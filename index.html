<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAEP Saúde</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pagina">

        <!-- COLUNA PERFIL -->
        <aside class="perfil">

            <div class="perfil-conteudo">

                <div class="empresa">

                    <img
                        src="iconeSENAI_NOVA.png"
                        alt="Logo SAEP Saúde"
                        class="logo"
                    >

                    <h1>SAEP Saúde</h1>

                </div>

                <div class="totais">

                    <div class="total">
                        <span class="numero">20</span>
                        <span class="descricao">Atividades</span>
                    </div>

                    <div class="total">
                        <span class="numero">5.420</span>
                        <span class="descricao">Calorias</span>
                    </div>

                </div>

                <button class="btn-atividades" disabled>
                    Atividades
                </button>

            </div>

            <footer class="rodape">

                <strong>SAEP Saúde</strong>

                <div class="redes-sociais">

                    <a href="#">
                        <img src="x.png" alt="Twitter">
                    </a>

                    <a href="#">
                        <img src="instagram.png" alt="Instagram">
                    </a>

                    <a href="#">
                        <img src="tiktok.png" alt="TikTok">
                    </a>

                </div>

                <span>© Copyright-2024</span>

            </footer>

        </aside>


        <!-- COLUNA MAIN -->
        <main class="main">

            <!-- CABEÇALHO -->
            <header class="cabecalho">

                <button
                    class="btn-login"
                    id="btn-login"
                    type="button"
                >
                    Login
                </button>

            </header>


            <!-- FILTROS -->
            <section class="filtros">

                <button
                    class="filtro ativo"
                    data-tipo="corrida"
                    type="button"
                >
                    Corrida
                </button>

                <button
                    class="filtro"
                    data-tipo="caminhada"
                    type="button"
                >
                    Caminhada
                </button>

                <button
                    class="filtro"
                    data-tipo="trilha"
                    type="button"
                >
                    Trilha
                </button>

            </section>


            <!-- LISTAGEM -->
            <section
                class="atividades"
                id="lista-atividades"
            >
                <!-- Cards criados pelo script.js -->
            </section>


            <!-- PAGINAÇÃO -->
            <nav
                class="paginacao"
                id="paginacao"
            >
            </nav>

        </main>

    </div>


    <!-- =====================================================
         MODAL DE LOGIN
    ====================================================== -->

    <div
        class="modal-login"
        id="modal-login"
        aria-hidden="true"
    >

        <div class="modal-conteudo">

            <h2>Login</h2>

            <form id="form-login">

                <div class="campo-login">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                    >

                </div>


                <div class="campo-login">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                    >

                </div>


                <div
                    class="mensagem-login"
                    id="mensagem-login"
                >
                </div>


                <div class="modal-acoes">

                    <button
                        type="button"
                        class="btn-cancelar"
                        id="btn-cancelar-login"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn-confirmar"
                    >
                        Login
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
